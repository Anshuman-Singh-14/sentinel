# gitleaks configuration: the default rules, plus one narrowly scoped allowlist.
#
# tests/security/test_redaction.py deliberately contains *fake* secrets (JWTs,
# keys, a PEM block) to prove the log redaction processor masks them. Only that
# single file is exempt. A real secret anywhere else still fails the scan.

[extend]
useDefault = true

[[allowlists]]
description = "Fake secrets used by the redaction security tests"
paths = ['''^backend/tests/security/test_redaction\.py$''']

[[allowlists]]
description = "Fake credentials and public test vectors used in unit/integration tests"
# Exact literals only (not a pattern for "anything in tests"), so a real
# secret pasted into a test file still fails the scan.
regexes = [
  # Fake passwords and a fake API key in the Phase 2 auth/audit tests.
  '''^violet-harbor-71-quartz$''',
  '''^copper-lantern-58-meadow$''',
  '''^vt-1234567890abcdef$''',
  # Fake threat-intel provider keys (Phase 8 unit and integration tests).
  '''^abuse-test-key-0123456789$''',
  '''^vt-test-key-0123456789$''',
  '''^shodan-test-key-0123456789$''',
  '''^abuse-integration-key-123456$''',
  '''^vt-integration-key-123456$''',
  # RFC 7519 section 3.1 example JWT (public; used by the JWT inspector tests).
  '''^eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9\.eyJpc3MiOiJqb2UiLA0KICJleHAiOjEzMDA4MTkzODAsDQogImh0dHA6Ly9leGFtcGxlLmNvbS9pc19yb290Ijp0cnVlfQ\.dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk$''',
]
