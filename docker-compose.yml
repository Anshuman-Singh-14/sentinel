# Sentinel development stack.  Usage:  docker compose up --build
#
# Security posture (04-security.md section 10):
# * postgres and redis are only on the `internal` network (no internet egress)
#   and never publish host ports.
# * Published ports bind to 127.0.0.1, so the stack is not reachable from the LAN.
# * App containers run as non-root, with all capabilities dropped and
#   no-new-privileges set.
# * Each service gets only the secrets it needs. The Postgres superuser
#   password never reaches the app containers.

name: sentinel

x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

x-logging-env: &logging-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Empty = auto: pretty console in development, JSON elsewhere.
  LOG_FORMAT: ${LOG_FORMAT:-}

x-backend-env: &backend-env
  <<: *logging-env
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  DATABASE_URL: postgresql://sentinel_app:${SENTINEL_DB_APP_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-sentinel}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  # Authentication (ADR 0003). Defaults match app/config.py.
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_IDLE_HOURS: ${REFRESH_TOKEN_IDLE_HOURS:-12}
  SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-24}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
  LOCKOUT_BASE_SECONDS: ${LOCKOUT_BASE_SECONDS:-60}
  LOCKOUT_MAX_SECONDS: ${LOCKOUT_MAX_SECONDS:-900}
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
  ALERT_FAILED_LOGIN_THRESHOLD: ${ALERT_FAILED_LOGIN_THRESHOLD:-5}
  ALERT_WINDOW_MINUTES: ${ALERT_WINDOW_MINUTES:-10}
  # Tool runs and the DNS tool (Phase 5). Defaults match app/config.py.
  RUN_RATE_LIMIT_PER_MINUTE: ${RUN_RATE_LIMIT_PER_MINUTE:-20}
  MAX_ACTIVE_RUNS_PER_USER: ${MAX_ACTIVE_RUNS_PER_USER:-3}
  DNS_NAMESERVERS: ${DNS_NAMESERVERS-1.1.1.1,9.9.9.9}
  # Scope policy (Phase 6). Infra subnets are always denied; the default allow
  # list is loopback plus the lab network. See docs/adr/0007-scope-policy.md.
  SCOPE_INFRA_SUBNETS: ${SENTINEL_INTERNAL_SUBNET:-10.231.0.0/24},${SENTINEL_EDGE_SUBNET:-10.231.1.0/24},${SENTINEL_EGRESS_SUBNET:-10.231.2.0/24},${SENTINEL_OBS_SUBNET:-10.231.3.0/24},${SENTINEL_OBS_UI_SUBNET:-10.231.4.0/24}
  SCOPE_DEFAULT_ALLOW: 127.0.0.0/8,::1/128,${SENTINEL_LAB_SUBNET:-10.231.10.0/24}
  PORT_SCAN_MAX_PORTS: ${PORT_SCAN_MAX_PORTS:-1024}
  NVD_API_KEY: ${NVD_API_KEY:-}
  WEB_CHECK_ALLOWED_PORTS: ${WEB_CHECK_ALLOWED_PORTS:-80,443,8000,8008,8080,8443,8888}
  # Threat intel (Phase 8): each provider is enabled only when its key is set.
  ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
  VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
  SHODAN_API_KEY: ${SHODAN_API_KEY:-}
  # Log analyzer (Phase 10, ADR 0014). Uploads land in the shared `uploads`
  # volume under the run id; LOG_ROOT is a read-only mount on the worker only.
  UPLOAD_DIR: /data/uploads
  LOG_ROOT: /data/logs
  LOG_UPLOAD_MAX_MB: ${LOG_UPLOAD_MAX_MB:-50}
  # File integrity monitor (Phase 11, ADR 0015). Named roots: the API needs the
  # names to validate parameters; only the worker mounts the directories.
  FIM_ROOTS: ${FIM_ROOTS-demo=/data/fim/demo}
  FIM_MAX_FILES: ${FIM_MAX_FILES:-20000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SENTINEL_DB_OWNER_PASSWORD: ${SENTINEL_DB_OWNER_PASSWORD:?set in .env}
      SENTINEL_DB_APP_PASSWORD: ${SENTINEL_DB_APP_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # Probe TCP, not the unix socket: during first-run init Postgres runs a
      # socket-only temporary server, and a socket probe would report "ready"
      # before the role-creation script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    # Persistence is off: Redis holds only the broker queue, transient results
    # and rate-limit counters. The durable state lives in Postgres.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no --save ''"]
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # REDISCLI_AUTH keeps the password out of the process argument list.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies Alembic migrations, then exits. It is the only container
  # that receives the schema-owner credential; api and worker connect as the
  # least-privilege sentinel_app role and start only after this succeeds.
  migrate:
    <<: *app-hardening
    restart: "no"
    build:
      context: ./backend
      target: dev
    image: sentinel-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *logging-env
      MIGRATION_DATABASE_URL: postgresql://sentinel_owner:${SENTINEL_DB_OWNER_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-sentinel}
    volumes:
      - ./backend:/app
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-hardening
    build:
      context: ./backend
      target: dev
    image: sentinel-backend:dev
    # --no-access-log: our middleware writes the access log with route templates.
    # --no-proxy-headers: client-IP trust is decided once, by TRUSTED_PROXIES.
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log", "--no-proxy-headers", "--log-config", "uvicorn-logging.json"]
    environment:
      <<: *backend-env
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}
      # /metrics for the observability profile (ADR 0016). Empty: endpoint off.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./backend:/app
      # The API writes uploads here; the worker reads and deletes them.
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [internal, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-hardening
    build:
      context: ./backend
      target: dev
    image: sentinel-backend:dev
    # --quiet suppresses the startup banner, which is printed straight to stdout
    # and would break the one-JSON-object-per-line log contract.
    command: ["celery", "-A", "app.core.tasks.celery_app:celery_app", "--quiet", "worker", "--loglevel=INFO", "--queues=default,scans,intel", "--concurrency=2"]
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
      # Server logs the analyzer may read (read-only). Defaults to the sample
      # logs; point LOG_ROOT_HOST at e.g. /var/log to analyse real ones.
      - ${LOG_ROOT_HOST:-./backend/tests/fixtures/logs}:/data/logs:ro
      # FIM root "demo" (read-only). The lab-fim service seeds and tampers
      # with it. A named volume, because Windows bind mounts lose POSIX modes.
      - fim_demo:/data/fim/demo:ro
    # `egress` gives the worker outbound internet access for tools (DNS from
    # Phase 5). It is a separate network so the API and data stores stay
    # without egress. Active tools are additionally gated by the scope policy
    # and infra denylist (Phase 6, docs/threat-model.md T10).
    networks: [internal, egress, lab]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.tasks.celery_app:celery_app inspect ping -d \"celery@$$HOSTNAME\" --timeout 5 > /dev/null"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  # Celery beat: publishes the FIM scheduled-check tick every minute (ADR 0015).
  # It only sends messages: no ports, no volumes, no FIM roots. The schedule
  # state file lives in /tmp, never in the source tree.
  beat:
    <<: *app-hardening
    build:
      context: ./backend
      target: dev
    image: sentinel-backend:dev
    command: ["celery", "-A", "app.core.tasks.celery_app:celery_app", "--quiet", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  # Integration tests against real Postgres and Redis (profile "test", never
  # started by a plain `docker compose up`):
  #   docker compose --profile test run --rm test
  # Uses the separate `sentinel_test` database (infra/postgres/init/02-test-db.sh)
  # and Redis DB 15, so it never touches dev data. It receives the owner
  # credential because the audit tests must bypass the append-only trigger
  # to prove that tampering is detected.
  test:
    <<: *app-hardening
    restart: "no"
    profiles: [test]
    build:
      context: ./backend
      target: dev
    image: sentinel-backend:dev
    command: ["pytest"]
    environment:
      <<: *logging-env
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql://sentinel_app:${SENTINEL_DB_APP_PASSWORD:?set in .env}@postgres:5432/sentinel_test
      TEST_OWNER_DATABASE_URL: postgresql://sentinel_owner:${SENTINEL_DB_OWNER_PASSWORD:?set in .env}@postgres:5432/sentinel_test
      TEST_REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/15
    volumes:
      - ./backend:/app
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    <<: *app-hardening
    build:
      context: ./frontend
      target: dev
    image: sentinel-frontend:dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./frontend:/app
      # Keep node_modules in a named volume. It never lands on the host, which
      # matters for OneDrive-synced checkouts and for native binaries built for Alpine.
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- Observability (profile "observability", ADR 0016) ---------------------
  #   LOG_FORMAT=json docker compose --profile observability up -d
  # then Grafana at http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD).
  # The `obs` network is internal; none of these services can reach Postgres
  # or Redis. Prometheus joins `edge` only to scrape the API.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    # The token is written to a 0600 file on tmpfs and read from there
    # (credentials_file), so it is not part of the Prometheus config.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - umask 077 && printf %s "$$METRICS_TOKEN" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d --web.listen-address=:9090
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [obs, edge]
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/sentinel.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/sentinel.yaml:ro
      - loki_data:/loki
    networks: [obs]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # Ships container logs to Loki from Docker's own JSON log files, mounted
  # read-only. No Docker socket (that would be root on the host). Runs as root
  # inside the container only to read those root-owned files, with every
  # capability dropped and a read-only root filesystem (ADR 0016).
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.20.1
    user: "0:0"
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/alloy-data", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/alloy-data
    networks: [obs]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    # Refuse to start without a password rather than fall back to admin/admin.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "Set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No phoning home from a security tool.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinel-overview.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [obs, obs_ui]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  # --- Lab targets (profile "lab"): docker compose --profile lab up -d -------
  # Deliberately simple services for the port scanner to find. Reachable only
  # from the worker over the internal `lab` network; no host ports.
  lab-web:
    profiles: [lab]
    image: nginxinc/nginx-unprivileged:1.31-alpine
    networks:
      lab:
        ipv4_address: ${SENTINEL_LAB_WEB_IP:-10.231.10.10}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # Pretends to be outdated FTP/SSH/Telnet/SMTP/MySQL servers by sending their
  # greeting banners. No real (or vulnerable) software runs: it is a teaching
  # target for banner grabbing and CVE matching. See infra/lab/banner_server.py.
  lab-banners:
    profiles: [lab]
    build:
      context: ./infra/lab
    image: sentinel-lab-banners:dev
    # Lets the unprivileged process bind ports below 1024 without any capability.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      lab:
        ipv4_address: ${SENTINEL_LAB_BANNERS_IP:-10.231.10.11}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    restart: unless-stopped

  # HTTPS target for the header/TLS checker: good security headers, an
  # HTTP->HTTPS redirect, and a self-signed certificate (a HIGH finding).
  lab-https:
    profiles: [lab]
    build:
      context: ./infra/lab/https
    image: sentinel-lab-https:dev
    networks:
      lab:
        ipv4_address: ${SENTINEL_LAB_HTTPS_IP:-10.231.10.13}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # A real Redis with no password: the classic "exposed database" finding.
  lab-redis:
    profiles: [lab]
    image: redis:7.4-alpine
    # Run as the image's redis user directly: the stock entrypoint's user
    # switch would need capabilities that are dropped here.
    user: redis
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    networks:
      lab:
        ipv4_address: ${SENTINEL_LAB_REDIS_IP:-10.231.10.12}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # Seeds the FIM demo volume with a small fake filesystem (etc/, usr/local/bin,
  # var/www, home/app/.ssh) and idles. Demo:
  #   docker compose exec lab-fim sh /opt/fim/tamper.sh
  # Runs as root *inside* the container so the seeded files are root-owned like
  # a real /etc, but with every capability dropped, no network at all,
  # no-new-privileges and a read-only root filesystem.
  lab-fim:
    profiles: [lab]
    image: python:3.12-slim
    user: "0:0"
    command: ["sh", "/opt/fim/seed.sh"]
    volumes:
      - fim_demo:/srv/fim
      - ./infra/lab/fim:/opt/fim:ro
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    restart: unless-stopped

# Subnets are pinned so the scope guard can deny Sentinel's own infrastructure
# by address (threat model T10). If they clash with another network on your
# machine, override the SENTINEL_*_SUBNET variables in .env: the same values
# are passed to the backend as SCOPE_INFRA_SUBNETS / SCOPE_DEFAULT_ALLOW.
networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${SENTINEL_INTERNAL_SUBNET:-10.231.0.0/24}
  edge:
    ipam:
      config:
        - subnet: ${SENTINEL_EDGE_SUBNET:-10.231.1.0/24}
  # Outbound-only network for the worker (nothing publishes ports on it).
  egress:
    ipam:
      config:
        - subnet: ${SENTINEL_EGRESS_SUBNET:-10.231.2.0/24}
  # Observability profile (ADR 0016). Internal: no internet, no data stores.
  obs:
    internal: true
    ipam:
      config:
        - subnet: ${SENTINEL_OBS_SUBNET:-10.231.3.0/24}
  # Only Grafana joins this one, to publish its port on 127.0.0.1.
  obs_ui:
    ipam:
      config:
        - subnet: ${SENTINEL_OBS_UI_SUBNET:-10.231.4.0/24}
  # Scan targets for the `lab` profile. Internal: lab containers cannot reach
  # the internet, and only the worker joins them here.
  lab:
    internal: true
    ipam:
      config:
        - subnet: ${SENTINEL_LAB_SUBNET:-10.231.10.0/24}

volumes:
  pgdata:
  frontend_node_modules:
  # Temporary uploads (deleted after each run). Not backed up on purpose.
  uploads:
  # FIM demo root (ADR 0015): written by lab-fim, read-only for the worker.
  fim_demo:
  # Observability profile (ADR 0016): 7-day retention each.
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
