[project]
name = "sentinel-backend"
version = "1.0.0"
description = "Sentinel API and workers: defensive security orchestration with educational findings."
requires-python = "==3.12.*"
# Exact pins keep builds reproducible and the supply chain auditable
# (04-security.md section 10). uv.lock pins the full transitive tree.
dependencies = [
    "fastapi==0.142.2",           # API framework
    "uvicorn[standard]==0.54.0",  # ASGI server (uvloop + httptools)
    "pydantic==2.13.5",           # boundary validation
    "pydantic-settings==2.15.0",  # env config with SecretStr
    "asyncpg==0.31.0",            # async Postgres driver (/ready now, SQLAlchemy in Phase 1)
    "redis==8.1.0",               # async Redis client (/ready, later pub/sub + rate limits)
    "celery[redis]==5.6.3",       # task workers
    "structlog==26.1.0",          # structured JSON logging
    "sqlalchemy[asyncio]==2.1.1", # async ORM
    "alembic==1.20.0",            # schema migrations (CLAUDE.md rule 10)
    "pyyaml==6.0.3",              # knowledge base YAML (safe_load only)
    "argon2-cffi==25.1.0",        # Argon2id password hashing (03-logging-audit.md section 1)
    "dnspython==2.8.0",           # async DNS resolver for dns_lookup (no shell `dig`, CLAUDE.md rule 1)
    "httpx==0.28.1",              # async HTTP client (NVD API; later header/TLS checker and threat intel)
    "cryptography==50.0.2",       # X.509 parsing of certificates that fail verification (header_tls)
    "reportlab==5.0.1",           # PDF reports (Phase 13); pure-Python layout, no HTML rendering
    "prometheus-client==0.26.0",  # /metrics for the optional observability profile (ADR 0016); no deps
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "S",      # flake8-bandit: security lint while editing; bandit proper runs in CI
    "BLE",    # blind `except Exception` needs an explicit, commented reason
    "ASYNC",  # blocking calls inside async code
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use deliberately fake secrets to prove redaction works.
"tests/**" = ["S101", "S105", "S106"]
"app/tools/*/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["asyncpg", "asyncpg.*", "celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ReportLab ships no type information; the PDF exporter subclasses its Canvas.
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.reports.exporters.pdf"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Celery's @task decorator is untyped; allow that only where tasks are declared.
module = ["app.core.tasks.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests", "app/tools"]
asyncio_mode = "auto"
addopts = "-ra -p no:cacheprovider"

[tool.bandit]
exclude_dirs = ["tests", "app/tools/*/tests"]
