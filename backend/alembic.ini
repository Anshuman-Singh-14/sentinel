# Alembic configuration.
#
# The database URL is NOT set here. env.py reads MIGRATION_DATABASE_URL from the
# environment: keeping credentials out of files and out of ini interpolation
# (where a "%" in a password breaks parsing). Logging is also configured in
# env.py, through Sentinel's redacting structlog pipeline.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os
