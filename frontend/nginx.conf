# Production static server + API reverse proxy (docker-compose.prod.yml, ADR 0011).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    client_max_body_size 25m;

    # API, health and WebSocket traffic keeps the API's own security headers
    # (stricter: default-src 'none'). Adding nginx's here as well would send
    # every header twice ("nosniff, nosniff"), which some parsers reject.
    location ~ ^/(api|health|ready)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Reports and audit exports can be several MB; stream them.
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }

    # The single-page app. Strict CSP: the build has no inline scripts or
    # styles. `connect-src 'self'` also covers same-origin ws:/wss: (CSP Level 3):
    # live run updates verified under this policy in Chromium and Firefox.
    # WebKit could not be checked over plain HTTP (it will not send the
    # Secure session cookies to http://localhost); see ADR 0011.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
