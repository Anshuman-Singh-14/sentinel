name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, bandit, pip-audit, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Gates run inside the same image docker compose uses, so CI and local
      # results cannot drift apart.
      - name: Build dev image
        run: docker build --target dev -t sentinel-backend:ci backend
      - name: ruff
        run: docker run --rm sentinel-backend:ci sh -c "ruff check . && ruff format --check ."
      - name: mypy
        run: docker run --rm sentinel-backend:ci mypy app tests alembic
      - name: bandit
        run: docker run --rm sentinel-backend:ci bandit -r app -ll -c pyproject.toml
      - name: pip-audit
        run: docker run --rm sentinel-backend:ci pip-audit --strict --progress-spinner off
      - name: pytest
        run: docker run --rm sentinel-backend:ci pytest
      - name: Build runtime image
        run: docker build --target runtime -t sentinel-backend:runtime backend

  frontend:
    name: Frontend (eslint, prettier, tsc, vitest, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=high
      - name: Build prod image
        run: docker build --target prod -t sentinel-frontend:prod .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Create throwaway .env
        run: |
          gen() { python3 -c "import secrets; print(secrets.token_hex(24))"; }
          sed -e "s/^POSTGRES_PASSWORD=CHANGE_ME/POSTGRES_PASSWORD=$(gen)/" \
              -e "s/^SENTINEL_DB_OWNER_PASSWORD=CHANGE_ME/SENTINEL_DB_OWNER_PASSWORD=$(gen)/" \
              -e "s/^SENTINEL_DB_APP_PASSWORD=CHANGE_ME/SENTINEL_DB_APP_PASSWORD=$(gen)/" \
              -e "s/^REDIS_PASSWORD=CHANGE_ME/REDIS_PASSWORD=$(gen)/" \
              -e "s/^VITE_USE_POLLING=.*/VITE_USE_POLLING=false/" \
              -e "s/^WATCHFILES_FORCE_POLLING=.*/WATCHFILES_FORCE_POLLING=false/" \
              -e "s/^LOG_FORMAT=.*/LOG_FORMAT=json/" \
              .env.example > .env
      - name: Start stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Probe endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:5173/health
          docker compose exec -T worker python -c \
            "from app.core.tasks.celery_app import ping; assert ping.delay().get(timeout=15) == 'pong'"
      - name: Migrations round-trip with no schema drift
        run: |
          docker compose run --rm -T migrate \
            sh -c "alembic downgrade base && alembic upgrade head && alembic check"
      - name: App role cannot change the schema
        run: |
          docker compose exec -T api python -c "
          import asyncio
          from sqlalchemy import text
          from app.db.session import get_engine
          async def main():
              async with get_engine().connect() as conn:
                  try:
                      await conn.execute(text('CREATE TABLE ci_should_fail (id int)'))
                  except Exception:
                      return
                  raise SystemExit('sentinel_app was able to run DDL')
          asyncio.run(main())"
      - name: Integration tests (real Postgres and Redis, separate test database)
        run: docker compose --profile test run --rm -T test pytest tests/integration -p no:warnings
      - name: Create first admin via CLI, log in, read the catalogue
        run: |
          echo "secure-pass-$(python3 -c 'import secrets; print(secrets.token_hex(8))')" > /tmp/pw
          docker compose exec -T api python -m app.cli create-admin --username ci-admin --password-stdin < /tmp/pw
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/tools)
          test "$code" = 401 || { echo "catalogue without a session returned $code"; exit 1; }
          python3 - <<'EOF'
          import http.cookiejar, json, urllib.request
          password = open("/tmp/pw").read().strip()
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/auth/login",
              data=json.dumps({"username": "ci-admin", "password": password}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with opener.open(request, timeout=10) as response:
              assert response.status == 200, response.status
              cookies = response.headers.get_all("Set-Cookie")
          assert any(c.startswith("__Host-sentinel_access=") and "HttpOnly" in c for c in cookies)
          print("login OK")
          EOF
      - name: API and worker logs are JSON with request_id on every line
        run: |
          curl -sS -o /dev/null -H "X-Request-ID: ci-check-001" http://127.0.0.1:8000/api/v1/tools
          docker compose logs --no-log-prefix api worker | python3 -c "
          import json, sys
          lines = [json.loads(l) for l in sys.stdin if l.strip()]
          assert lines, 'no log lines'
          assert all('request_id' in l for l in lines), 'line without request_id'
          assert any(l.get('request_id') == 'ci-check-001' for l in lines), 'request id missing'
          print(len(lines), 'JSON lines OK')"
      - name: Postgres and Redis must not be reachable from the host
        run: |
          for port in 5432 6379; do
            if timeout 3 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "port $port is reachable from the host" && exit 1
            fi
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
