# Plain HTTP only redirects to HTTPS.
server {
    listen 8080;
    server_name lab-https;
    server_tokens off;
    return 301 https://lab-https:8443$request_uri;
}

# HTTPS with a deliberately good header set (but a self-signed certificate).
server {
    listen 8443 ssl;
    server_name lab-https;
    server_tokens off;
    ssl_certificate     /etc/nginx/tls/lab.crt;
    ssl_certificate_key /etc/nginx/tls/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Set-Cookie "labsession=demo; Path=/; Secure; HttpOnly; SameSite=Lax" always;

    location / {
        default_type text/plain;
        return 200 "lab-https\n";
    }
}
